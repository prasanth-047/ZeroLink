[package]
name = "zerolink-win"
version = "0.1.0"
edition = "2021"
authors = ["ZeroLink Authors"]
description = "High-performance, resource-lean Windows Daemon for ZeroLink"

[dependencies]
zerolink-core = { path = "../zerolink-core" }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Com",
    "Win32_Storage_CloudFilters",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Data_Xml_Dom",
    "UI_Notifications",
] }
tokio = { version = "1.38", features = ["full"] }
siphasher = "1.0"
byteorder = "1.5"
tracing = "0.1"
tracing-subscriber = "0.3"
